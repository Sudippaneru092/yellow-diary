<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Signup - Yellow Diary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      width: 400px;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    .tab-buttons {
      display: flex;
      justify-content: space-around;
      margin-bottom: 1rem;
    }
    .tab-buttons button {
      flex: 1;
      padding: 0.8rem;
      cursor: pointer;
      border: none;
      background: #fdd835;
      font-weight: bold;
    }
    .tab-buttons button.active {
      background: #fbc02d;
    }
    form {
      display: none;
      flex-direction: column;
    }
    form.active {
      display: flex;
    }
    input, select, textarea {
      margin-bottom: 1rem;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 100%;
    }
    button.submit-btn {
      background: #fdd835;
      border: none;
      padding: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
    }
    #businessFields {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="tab-buttons">
    <button id="loginTab" class="active" onclick="switchForm('login')">Login</button>
    <button id="signupTab" onclick="switchForm('signup')">Signup</button>
  </div>

  <!-- Login Form -->
  <form id="loginForm" class="active" method="POST" action="login_process.php">
    <input type="email" name="email" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" required />
    <select name="userType" required>
      <option value="">Select Account Type</option>
      <option value="general">General User</option>
      <option value="business">Business Owner</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit" class="submit-btn">Login</button>
  </form>

  <!-- Signup Form -->
  <form id="signupForm" method="POST" action="signup_process.php" enctype="multipart/form-data">
    <input type="text" name="fullName" placeholder="Full Name" required />
    <input type="email" name="email" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" required />
    <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
    <select name="userType" id="signupUserType" required onchange="toggleBusinessFields()">
      <option value="">Select Account Type</option>
      <option value="general">General User</option>
      <option value="business">Business Owner</option>
    </select>

    <div id="businessFields">
      <input type="text" name="businessName" placeholder="Business Name" />
      <textarea name="businessDescription" placeholder="Business Description"></textarea>
      <input type="text" name="businessLocation" placeholder="Business Location" />
      <select name="businessCategory">
        <option value="">Select Business Category</option>
        <option value="restaurants">Restaurant</option>
        <option value="hotels">Hotel</option>
        <option value="schools">School</option>
        <option value="hospitals">Hospital</option>
        <option value="jobs">Job Provider</option>
        <option value="events">Event Organizer</option>
        <option value="announcements">Announcements</option>
      </select>
      <label>Upload Logo or Image:</label>
      <input type="file" name="businessLogo" accept="image/*" />
    </div>

    <button type="submit" class="submit-btn">Signup</button>
  </form>
</div>

<script>
  function switchForm(form) {
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');

    if (form === 'login') {
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
    } else {
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
    }
  }

  function toggleBusinessFields() {
    const userType = document.getElementById('signupUserType').value;
    const businessFields = document.getElementById('businessFields');
    if (userType === 'business') {
      businessFields.style.display = 'block';
    } else {
      businessFields.style.display = 'none';
    }
  }
</script>

</body>
</html>
